name: EPM Notifier

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Lo dispara el Cloudflare Worker (webhook de Telegram): una ejecución por comando o botón.
  repository_dispatch:
    types: [telegram_update, cron_tick] # cron_tick: disparador de respaldo (Cron Trigger del Worker)

# Escribe solo en la rama `state` (estado del bot); el código de `main` no se toca.
permissions:
  contents: write

# - Cron y ejecuciones manuales comparten un grupo: nunca dos a la vez.
# - Cada update de Telegram tiene su PROPIO grupo (update_id): GitHub conserva solo una ejecución pendiente por
#   grupo y cancela las más viejas, así que con un grupo común varias pulsaciones seguidas se perderían.
#   El orden de escritura en `state` lo resuelve scripts/epm-run.sh (reintenta sobre el estado más reciente).
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'telegram_update' && format('tg-{0}', github.event.client_payload.update.update_id) || 'epm-cron' }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Los secretos solo se pasan a este paso. La update (chat ids y texto de un usuario) NO se pasa por `env:` ni
      # se interpola en el `run:`: GitHub imprime el bloque env en los logs (públicos) y la interpolación permitiría
      # inyección de comandos. El script la lee del archivo del evento ($GITHUB_EVENT_PATH).
      - name: Ejecutar notificador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          # Opcionales: permiten volver a registrar el webhook solos si Telegram deja de poder entregar.
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          # Para reenviar comandos pendientes como repository_dispatch (respaldo del cron).
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          PERFIL: ${{ vars.PERFIL }}
          STATE_FILE: ${{ github.workspace }}/run/seen.json
        run: bash scripts/epm-run.sh
