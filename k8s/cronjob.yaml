apiVersion: batch/v1
kind: CronJob
metadata:
  name: epm-notifier
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000 # el usuario "node" puede escribir en el PVC
          containers:
            - name: notifier
              image: epm-notifier:latest # ajusta a tu registro
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: epm-notifier
              env:
                - name: STATE_FILE
                  value: /data/seen.json
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: epm-notifier-data
