# Copia a secret.yaml (ignorado por git), rellena y aplica.
# O sin archivo:
#   kubectl create secret generic epm-notifier \
#     --from-literal=TELEGRAM_BOT_TOKEN=... --from-literal=TELEGRAM_CHAT_ID=...
apiVersion: v1
kind: Secret
metadata:
  name: epm-notifier
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "123456789:REEMPLAZA_CON_TU_TOKEN"
  TELEGRAM_CHAT_ID: "123456789"
  KEYWORDS: ""
